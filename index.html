<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spotify to Muzpa Playlist Downloader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #14161A;
  --panel: #1C1F26;
  --panel-alt: #20232B;
  --border: #2A2E37;
  --border-soft: #23262E;
  --text: #EDEFF2;
  --text-muted: #8B93A1;
  --text-dim: #5C636F;

  --accent-active: #6FA8FF;   /* queued */
  --accent-progress: #F2B84B; /* downloading */
  --accent-ok: #5EE6A0;       /* downloaded */
  --accent-skip: #B98CE0;     /* skipped */
  --accent-error: #F0616B;    /* error */

  --radius: 10px;
  --font-display: 'Space Grotesk', sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ---------- Header ---------- */
.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1.5rem;
  padding: 1.25rem 2rem;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, #17191F 0%, var(--bg) 100%);
  flex-wrap: wrap;
}

.header-left { min-width: 0; }

.eyebrow {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  letter-spacing: 0.14em;
  color: var(--text-dim);
  text-transform: uppercase;
  margin-bottom: 0.35rem;
}

.playlist-title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.4rem;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 1.25rem;
  flex-wrap: wrap;
}

.meter {
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
  min-width: 220px;
}

.meter-label {
  font-size: 0.72rem;
  color: var(--text-muted);
  display: flex;
  justify-content: space-between;
}

.meter-track {
  display: flex;
  gap: 3px;
  height: 10px;
}

.meter-seg {
  flex: 1;
  border-radius: 2px;
  background: var(--border);
  transition: background 0.25s ease;
}

.meter-seg.filled { background: var(--accent-ok); }

.btn {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 0.85rem;
  letter-spacing: 0.02em;
  border: none;
  border-radius: 8px;
  padding: 0.65rem 1.3rem;
  cursor: pointer;
  transition: transform 0.08s ease, filter 0.15s ease;
}
.btn:active { transform: scale(0.97); }

.btn-primary { background: var(--accent-ok); color: #0E1310; }
.btn-primary:hover { filter: brightness(1.08); }

.btn-ghost {
  background: transparent;
  color: var(--text-muted);
  border: 1px solid var(--border);
}
.btn-ghost:hover { color: var(--text); border-color: var(--text-dim); }

.btn-download {
  background: var(--accent-active);
  color: #0B1220;
  font-size: 0.8rem;
  padding: 0.5rem 1rem;
  white-space: nowrap;
}
.btn-download:hover { filter: brightness(1.1); }

/* ---------- Layout ---------- */
.layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
  gap: 1.25rem;
  padding: 1.5rem 2rem 2rem;
  max-width: 1400px;
  margin: 0 auto;
  flex: 1;
  width: 100%;
}

@media (max-width: 880px) {
  .layout { grid-template-columns: 1fr; padding: 1.25rem; }
  .app-header { padding: 1rem 1.25rem; }
}

.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
}

.panel-header {
  padding: 1rem 1.25rem 0.85rem;
  border-bottom: 1px solid var(--border-soft);
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 0.75rem;
}

.panel-title {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 0.95rem;
  color: var(--text);
}

.panel-sub {
  font-size: 0.72rem;
  color: var(--text-dim);
}

/* ---------- Playlist list ---------- */
.track-list {
  list-style: none;
  margin: 0;
  padding: 0.4rem;
  overflow-y: auto;
  max-height: 62vh;
}

.track-row {
  display: grid;
  grid-template-columns: 28px 1fr auto;
  align-items: center;
  gap: 0.6rem;
  padding: 0.55rem 0.6rem;
  border-radius: 8px;
  margin-bottom: 2px;
  cursor: pointer;
  transition: background 0.12s ease;
}

.track-row:hover { background: rgba(255,255,255,0.03); }

.track-row.current {
  background: var(--panel-alt);
  box-shadow: inset 0 0 0 1px var(--border);
}

.track-idx {
  font-size: 0.72rem;
  color: var(--text-dim);
  text-align: right;
}

.track-info { min-width: 0; }

.track-name {
  font-family: var(--font-display);
  font-size: 0.85rem;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.track-artist {
  font-size: 0.72rem;
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ---------- Status badges (LED style) ---------- */
.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  font-size: 0.68rem;
  font-family: var(--font-mono);
  letter-spacing: 0.03em;
  text-transform: uppercase;
  padding: 0.28rem 0.55rem;
  border-radius: 20px;
  white-space: nowrap;
  border: 1px solid transparent;
}

.led {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}

.status-pending { color: var(--text-dim); background: rgba(139,147,161,0.08); }
.status-pending .led { background: var(--text-dim); }

.status-queued { color: var(--accent-active); background: rgba(111,168,255,0.12); }
.status-queued .led { background: var(--accent-active); }

.status-downloading { color: var(--accent-progress); background: rgba(242,184,75,0.14); }
.status-downloading .led { background: var(--accent-progress); animation: pulse 1s infinite ease-in-out; }

.status-downloaded { color: var(--accent-ok); background: rgba(94,230,160,0.1); }
.status-downloaded .led { background: var(--accent-ok); }

.status-skipped { color: var(--accent-skip); background: rgba(185,140,224,0.12); }
.status-skipped .led { background: var(--accent-skip); }

.status-error { color: var(--accent-error); background: rgba(240,97,107,0.12); }
.status-error .led { background: var(--accent-error); }

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.35; }
}

/* ---------- Results panel ---------- */
.results-body {
  padding: 1rem 1.25rem;
  overflow-y: auto;
  max-height: 62vh;
  display: flex;
  flex-direction: column;
  gap: 0.7rem;
}

.results-empty {
  margin: auto;
  text-align: center;
  color: var(--text-dim);
  font-size: 0.85rem;
  padding: 2rem 1rem;
  max-width: 320px;
}

.loader {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  margin: auto;
  color: var(--text-muted);
  font-size: 0.82rem;
}

.spinner {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  border: 2px solid var(--border);
  border-top-color: var(--accent-active);
  animation: spin 0.7s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.current-target {
  font-family: var(--font-display);
  font-size: 0.95rem;
  color: var(--text);
  margin-bottom: 0.15rem;
}
.current-target .sep { color: var(--text-dim); margin: 0 0.35rem; }

.candidate {
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0.75rem 0.9rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 0.9rem;
  background: var(--panel-alt);
}

.candidate.best {
  border-color: var(--accent-ok);
  box-shadow: 0 0 0 1px rgba(94,230,160,0.25);
}

.candidate-main { min-width: 0; }

.best-ribbon {
  display: inline-block;
  font-size: 0.62rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--accent-ok);
  margin-bottom: 0.3rem;
}

.candidate-name {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 0.88rem;
  color: var(--text);
  overflow-wrap: anywhere;
}

.candidate-meta {
  font-size: 0.72rem;
  color: var(--text-muted);
  margin-top: 0.25rem;
}

.skip-row { padding-top: 0.25rem; }

/* ---------- Toasts ---------- */
#toast-stack {
  position: fixed;
  bottom: 1.25rem;
  right: 1.25rem;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  z-index: 50;
  max-width: 320px;
}

.toast {
  background: var(--panel-alt);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent-error);
  border-radius: 8px;
  padding: 0.7rem 0.9rem;
  font-size: 0.78rem;
  color: var(--text);
  box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  animation: toast-in 0.2s ease;
}

@keyframes toast-in {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ---------- Footer ---------- */
.app-footer {
  text-align: center;
  padding: 1rem;
  font-size: 0.7rem;
  color: var(--text-dim);
  border-top: 1px solid var(--border);
  letter-spacing: 0.03em;
}
</style>
</head>
<body>

<header class="app-header">
  <div class="header-left">
    <div class="eyebrow">Spotify to Muzpa Playlist Downloader</div>
    <div class="playlist-title" id="playlist-title">Loading playlist...</div>
  </div>
  <div class="header-right">
    <div class="meter">
      <div class="meter-label"><span id="meter-count">0 / 0</span><span id="meter-status">idle</span></div>
      <div class="meter-track" id="meter-track"></div>
    </div>
    <div id="action-button-area"></div>
  </div>
</header>

<main class="layout">
  <section class="panel">
    <div class="panel-header">
      <div class="panel-title">Your playlist</div>
      <div class="panel-sub" id="playlist-sub">—</div>
    </div>
    <ul class="track-list" id="tracks-list"></ul>
  </section>

  <section class="panel">
    <div class="panel-header">
      <div class="panel-title">Muzpa results</div>
      <div class="panel-sub" id="results-sub">—</div>
    </div>
    <div class="results-body" id="results-body"></div>
  </section>
</main>

<footer class="app-footer">Agustin Marquardt © 2026 · Spotify2Muzpa</footer>

<div id="toast-stack"></div>

<script>
const STATUS_LABELS = {
  pending: 'Pending',
  queued: 'Queued',
  downloading: 'Downloading',
  downloaded: 'Downloaded',
  skipped: 'Skipped',
  error: 'Error',
};

let seenErrorTracks = new Set();
let toastId = 0;

function statusBadge(status) {
  const label = STATUS_LABELS[status] || status;
  return `<span class="status-badge status-${status}"><span class="led"></span>${label}</span>`;
}

function showToast(message) {
  const stack = document.getElementById('toast-stack');
  const id = 'toast-' + (toastId++);
  const el = document.createElement('div');
  el.className = 'toast';
  el.id = id;
  el.textContent = message;
  stack.appendChild(el);
  setTimeout(() => {
    const node = document.getElementById(id);
    if (node) node.remove();
  }, 5000);
}

async function fetchState() {
  const res = await fetch('/api/state');
  if (!res.ok) throw new Error('Could not fetch state');
  return await res.json();
}

async function start() {
  await fetch('/api/start', { method: 'POST' });
}

async function decide(action, href) {
  await fetch('/api/decide', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action, href })
  });
}

async function searchTrack(idx) {
  await fetch('/api/search-track', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ idx })
  });
}

function renderMeter(state) {
  const total = state.tracks.length;
  const done = state.tracks.filter(t => ['downloaded', 'skipped', 'error'].includes(t.status)).length;
  document.getElementById('meter-count').textContent = `${done} / ${total}`;
  document.getElementById('meter-status').textContent = state.status;

  const track = document.getElementById('meter-track');
  const segCount = 24;
  const filled = total ? Math.round((done / total) * segCount) : 0;
  track.innerHTML = '';
  for (let i = 0; i < segCount; i++) {
    const seg = document.createElement('div');
    seg.className = 'meter-seg' + (i < filled ? ' filled' : '');
    track.appendChild(seg);
  }
}

function renderActionButton(state) {
  const area = document.getElementById('action-button-area');
  if (state.status === 'idle') {
    area.innerHTML = '<button class="btn btn-primary" id="start-btn">Start</button>';
    document.getElementById('start-btn').onclick = start;
  } else {
    area.innerHTML = '';
  }
}

function renderTracks(tracks, currentIndex) {
  const list = document.getElementById('tracks-list');
  list.innerHTML = '';
  tracks.forEach((t, i) => {
    const li = document.createElement('li');
    li.className = 'track-row' + (i === currentIndex ? ' current' : '');
    li.title = 'Click to search this track now';
    li.innerHTML = `
      <div class="track-idx">${i + 1}</div>
      <div class="track-info">
        <div class="track-name">${t.track}</div>
        <div class="track-artist">${t.artist}</div>
      </div>
      ${statusBadge(t.status)}
    `;
    li.onclick = () => searchTrack(i);
    list.appendChild(li);
  });
  document.getElementById('playlist-sub').textContent = `${tracks.length} tracks`;
}

function renderResults(state) {
  const body = document.getElementById('results-body');
  const sub = document.getElementById('results-sub');

  if (state.status === 'idle') {
    sub.textContent = '—';
    body.innerHTML = '<div class="results-empty">Click “Start” to begin searching each playlist track on Muzpa. You can also click any track on the left at any time to jump straight to it.</div>';
    return;
  }

  if (state.status === 'searching') {
    const t = state.tracks[state.current_index];
    sub.textContent = `Track ${state.current_index + 1} / ${state.tracks.length}`;
    body.innerHTML = `
      <div class="current-target">${t.artist}<span class="sep">·</span>${t.track}</div>
      <div class="loader"><div class="spinner"></div>Searching Muzpa...</div>
    `;
    return;
  }

  if (state.status === 'awaiting_confirmation') {
    const t = state.tracks[state.current_index];
    sub.textContent = `Track ${state.current_index + 1} / ${state.tracks.length}`;
    let html = `<div class="current-target">${t.artist}<span class="sep">·</span>${t.track}</div>`;

    if (state.candidates.length === 0) {
      html += '<div class="results-empty">No results found on Muzpa for this track.</div>';
    } else {
      state.candidates.forEach(c => {
        html += `
          <div class="candidate ${c.best ? 'best' : ''}">
            <div class="candidate-main">
              ${c.best ? '<div class="best-ribbon">★ Best match</div>' : ''}
              <div class="candidate-name">${c.name}</div>
              <div class="candidate-meta">${c.category ? c.category + ' · ' : ''}${c.info}</div>
            </div>
            <button class="btn btn-download" onclick="decide('download', '${c.href}')">Download</button>
          </div>
        `;
      });
    }
    html += `<div class="skip-row"><button class="btn btn-ghost" onclick="decide('skip', null)">Skip this track</button></div>`;
    body.innerHTML = html;
    return;
  }

  if (state.status === 'done') {
    sub.textContent = 'Done';
    body.innerHTML = '<div class="results-empty">All tracks processed. Click any track on the left to re-search or re-download it.</div>';
    return;
  }

  sub.textContent = '—';
  body.innerHTML = `<div class="results-empty">${state.message || ''}</div>`;
}

function checkForNewErrors(state) {
  state.tracks.forEach((t, i) => {
    if (t.status === 'error' && !seenErrorTracks.has(i)) {
      seenErrorTracks.add(i);
      showToast(`${t.artist} - ${t.track}: ${t.error_message || 'a download error occurred'}`);
    }
  });
}

async function poll() {
  try {
    const state = await fetchState();
    document.getElementById('playlist-title').textContent = state.playlist_name || 'Playlist';
    renderMeter(state);
    renderActionButton(state);
    renderTracks(state.tracks, state.current_index);
    renderResults(state);
    checkForNewErrors(state);
  } catch (e) {
    console.error(e);
  }
  setTimeout(poll, 1000);
}

poll();
</script>
</body>
</html>
